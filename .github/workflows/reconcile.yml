# Mall v3 reconcile scheduler (docs/mall1/v3/CUTOVER.md 3.3).
#
# Calls POST /api/internal/reconcile of client-web every 5 minutes: reverses
# orphan Payments and executes PENDING payment reversals.
#
# DISABLED BY DEFAULT. The job is skipped unless the repository VARIABLE
# RECONCILE_ENABLED is exactly "true". Set it only at step 8 of the cutover,
# after the v3 deployment is promoted and the production E2E passed. Turning it
# back to anything else stops the job without touching this file.
#
# Needs two repository SECRETS (values are never printed):
#   CLIENT_WEB_URL        the client-web production base URL, no trailing path
#   RECONCILE_JOB_SECRET  the same value as the RECONCILE_JOB_SECRET server variable
#
# GitHub runs scheduled workflows from the default branch only, on a best-effort
# clock: a run can start a few minutes late, which the job tolerates.
name: reconcile

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ vars.RECONCILE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the reconcile endpoint
        env:
          CLIENT_WEB_URL: ${{ secrets.CLIENT_WEB_URL }}
          RECONCILE_JOB_SECRET: ${{ secrets.RECONCILE_JOB_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_WEB_URL}" ] || [ -z "${RECONCILE_JOB_SECRET}" ]; then
            echo "CLIENT_WEB_URL and RECONCILE_JOB_SECRET must both be set."
            exit 1
          fi
          # The response carries counts only ({orphansReversed, reversalsScanned, executed}).
          curl --silent --show-error --fail-with-body \
            --max-time 120 --retry 2 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer ${RECONCILE_JOB_SECRET}" \
            "${CLIENT_WEB_URL%/}/api/internal/reconcile"
          echo
